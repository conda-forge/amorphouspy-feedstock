schema_version: 1

context:
  version: "0.8.1"
  python_min: "3.12"

recipe:
  name: amorphouspy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/amorphouspy/amorphouspy-${{ version }}.tar.gz
  sha256: 392856cd3e074c8e25cf733db45df54d4052edb02a809c936540ead4ca3d022a

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: amorphouspy
    build:
      noarch: python
      script: python -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - hatchling >=1.21
      run:
        - python >=${{ python_min }}
        - ase
        - jupyter
        - lammps ==2024.08.29
        - lammpsparser >=0.0.7
        - numba
        - numpy
        - pandas
        - pymatgen
        - scipy
        - networkx
        - pymcubes 
    tests:
      - python:
          imports:
            - amorphouspy
          python_version:
            - ${{ python_min }}.*
            - "*"

  - package:
      name: amorphouspy-api
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage("amorphouspy", exact=true) }}
        - executorlib >=1.10
        - h5py
        - pysqa
        - sqlalchemy
        - uvicorn
        - jinja2
        - fastapi
        - mcp >=1.6.0
        - flux-core >=0.81.0
    tests:
      - python:
          imports:
            - amorphouspy_api
          python_version:
            - ${{ python_min }}.*
            - "*"

about:
  homepage: https://github.com/glasagent/amorphouspy
  summary: Workflows for atomistic modeling of oxide glasses
  description: |
    A Python package for atomistic simulations of glasses. amorphouspy provides
    capabilities from generating initial structural models through running
    molecular dynamics simulations with LAMMPS, all the way to computing
    material properties and performing detailed structural analysis.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://glasagent.github.io/amorphouspy/
  repository: https://github.com/glasagent/amorphouspy

extra:
  recipe-maintainers:
    - ltalirz
